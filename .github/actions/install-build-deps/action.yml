name: Install build dependencies
description: >
  apt-get the toolchain and GStreamer packages the build needs, retrying against
  archive.ubuntu.com when the default Azure mirror times out.

inputs:
  extra-packages:
    description: Additional apt packages to install, space separated.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # -dev packages for the build (libmisbklv's gstreamer backend links
    # gstreamer-1.0, gstreamer-app-1.0 and gstreamer-codecparsers-1.0); the
    # plugin packages for the run. The conversion loads coreelements (core),
    # typefindfunctions and app (base), isomp4/qtdemux (good), and mpegtsmux +
    # videoparsersbad (bad). libmisbklv now selects explicit demuxers, so it
    # no longer needs playback/parsebin or audioparsers at runtime.
    #
    # libgstreamer-plugins-bad1.0-dev is easy to miss: codecparsers is a *-dev*
    # package, and installing only the runtime gstreamer1.0-plugins-bad leaves
    # libmisbklv quietly building without its media backend. That is not a
    # theoretical trap — it is what it did here, and every build failed at
    # configure until this line was added.
    - shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        install_dependencies() {
          sudo timeout --foreground 120 apt-get \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 update &&
          sudo timeout --foreground 300 apt-get \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 install -y --no-install-recommends \
            cmake g++ ${EXTRA_PACKAGES} \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad
        }

        if ! install_dependencies; then
          echo "::warning::Default Ubuntu mirror failed or timed out; retrying archive.ubuntu.com"
          sudo find /etc/apt -type f \( -name apt-mirrors.txt -o -name '*.list' -o -name '*.sources' \) \
            -exec sed -i \
              -e 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
              -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' {} +
          sudo rm -rf /var/lib/apt/lists/*
          # A timed-out install can leave packages unpacked. Finish that
          # transaction before asking apt to resolve dependencies again.
          sudo timeout --foreground 300 dpkg --configure -a
          sudo timeout --foreground 300 apt-get \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 --fix-broken install -y
          install_dependencies
        fi
