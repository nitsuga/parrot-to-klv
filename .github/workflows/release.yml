name: Release bundle

# Builds the relocatable bundle a user can extract and run without installing
# anything — see context/decisions/0009-release-bundle.md.
#
# Tag-driven, plus manual runs for testing the pipeline without minting a
# release. A manual run produces the artifact and proves it works; only a tag
# publishes.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a half-finished publish

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    # The host label supplies compute; the digest-pinned job container supplies
    # the oldest supported userspace. glibc compatibility runs forward only: a
    # binary built against 22.04's 2.35 runs on 24.04, one built on 24.04 does
    # not run on 22.04. The symbol check below enforces that floor independently.
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:22.04@sha256:2edbbc5dc405e9612ba3584ce95480277e3eb374407b5505fe26f17df77c7dbc
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      # A bare Ubuntu container has no git. checkout's REST fallback cannot
      # materialize LFS objects and fails when lfs=true, so bootstrap both tools
      # before asking checkout to touch the repository (ADR 0017).
      - name: Bootstrap checkout
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git git-lfs

      - uses: actions/checkout@v7
        with:
          lfs: true  # test fixtures must be materialized, not left as pointers

      - name: Install build dependencies
        run: |
          # The old runner-image build removed LLVM's preinstalled
          # libunwind-*-dev before this install. The stock job container has no
          # libunwind development package, so install the required one directly.
          # GitHub mounts the host daemon socket into job containers; docker.io
          # supplies the client that builds the image from this job's bundle.
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake docker.io g++ make libunwind-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad
          docker version

      - name: Build
        run: |
          cmake --preset release-bundle
          cmake --build --preset release-bundle --target parrot-to-klv -j"$(nproc)"

      # The portability guarantee, checked rather than assumed. Everything the
      # binary imports must exist on the oldest target; 22.04 ships glibc 2.35.
      # This fails the build rather than shipping something that dies on a user's
      # machine with a symbol-version error.
      - name: Check the glibc floor
        run: |
          max=$(objdump -T build/bundle/parrot-to-klv \
                | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1)
          echo "highest glibc symbol required: $max"
          if [ "$(printf '%s\nGLIBC_2.35\n' "$max" | sort -V | tail -1)" != "GLIBC_2.35" ]; then
            echo "::error::binary needs $max, above the 2.35 floor — it will not run on 22.04"
            exit 1
          fi

      - name: Assemble the bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="$(printf '%.7s' "$GITHUB_SHA")"
          name="parrot-to-klv-${version}-linux-${ARCH}"
          echo "BUNDLE_NAME=$name" >> "$GITHUB_ENV"
          ./packaging/make-bundle.sh build/bundle "staging/$name"
          tar -C staging -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" | tee "$name.tar.gz.sha256"

      # Built from the staged bundle, in this job, on purpose: one artifact feeds
      # both deliverables, so they cannot describe different binaries (ADR 0010).
      - name: Assemble the container deliverable
        run: |
          version="${BUNDLE_NAME#parrot-to-klv-}"; version="${version%-linux-$ARCH}"
          name="${BUNDLE_NAME}-docker"
          echo "DOCKER_NAME=$name" >> "$GITHUB_ENV"
          ./packaging/make-image.sh "staging/$BUNDLE_NAME" "$version" "$ARCH" "staging/$name"
          tar -C staging -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" | tee "$name.tar.gz.sha256"

      # artifact actions on their current majors. These run on node24 and need a
      # runner >= 2.327.1 — fine on GitHub-hosted runners, worth knowing if this
      # ever moves to a self-hosted one. The v4 line still works but runs on
      # node20, which is what produces the runtime deprecation warnings.
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.arch }}
          path: |
            ${{ env.BUNDLE_NAME }}.tar.gz
            ${{ env.BUNDLE_NAME }}.tar.gz.sha256
            ${{ env.DOCKER_NAME }}.tar.gz
            ${{ env.DOCKER_NAME }}.tar.gz.sha256
          if-no-files-found: error

      # Carried separately so the smoke job needs no checkout: a bare container
      # has no git, and the point of that job is to add as little as possible.
      - uses: actions/upload-artifact@v7
        with:
          name: smoke-fixtures-${{ matrix.arch }}
          path: test/fixtures/parrot_v3_video_audio.mp4
          if-no-files-found: error

  smoke:
    # The actual claim under test: a clean, *newest* target with no GStreamer
    # installed. This is the job that would have caught the two-day CI outage,
    # and it is the reason this workflow exists rather than trusting the glibc
    # argument alone.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ubuntu:24.04
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bundle-${{ matrix.arch }}
          path: dl
      - uses: actions/download-artifact@v8
        with:
          name: smoke-fixtures-${{ matrix.arch }}
          path: fixtures

      # Prove the negative before relying on it. If a base image ever starts
      # shipping GStreamer, this test quietly stops testing anything.
      - name: Confirm the container has no GStreamer
        run: |
          if ldconfig -p 2>/dev/null | grep -q libgstreamer; then
            echo "::error::base image ships GStreamer — this smoke test proves nothing"
            exit 1
          fi
          echo "no GStreamer present, as required"

      - name: Extract and convert
        run: |
          # Specific, not dl/*.tar.gz: the container deliverable sits beside this
          # one and would be swept up by a loose glob.
          tar -xzf dl/parrot-to-klv-*-linux-${ARCH}.tar.gz
          cd parrot-to-klv-*-linux-${ARCH}/
          ./parrot-to-klv ../fixtures/parrot_v3_video_audio.mp4 -o /tmp/out.ts
          test -s /tmp/out.ts || { echo "::error::no output written"; exit 1; }

      # A file of the right size is not proof it is right. Check the two things
      # the tool exists to produce: a KLV stream, and ST 0604 in the video.
      - name: Check the output is actually a conversion
        run: |
          grep -qa KLVA /tmp/out.ts \
            || { echo "::error::no KLVA registration descriptor in the output"; exit 1; }
          n=$(grep -ac MISPmicrosectime /tmp/out.ts || true)
          [ "${n:-0}" -gt 0 ] \
            || { echo "::error::no ST 0604 SEI in the video elementary stream"; exit 1; }
          echo "output carries KLV and ST 0604"

      # The live paths (ADR 0013/0015) instantiate udpsink/srtsink/rtspsrc plus
      # their depayloaders, which the file->file path never touches. A bundle
      # that shipped only the conversion plugins passed every check above yet
      # failed the moment a user asked for `-o srt://…` or `-i rtsp://…`. srt
      # and rtsp cannot do a real end-to-end pass without a peer, so prove each
      # live-path plugin instead by the failure modes that actually bite:
      # omitted, mis-named, or shipped without one of its transitive libraries.
      # ldd against the plugin under the bundle's own lib path catches all three
      # — a "not found" line is exactly what a plugin that would fail to load at
      # runtime prints — and it needs no network. Do this for all five, not just
      # udpsink, so the guarantee covers every plugin this PR added.
      - name: Check every live-path plugin loads from the bundle
        run: |
          b=$(echo parrot-to-klv-*-linux-${ARCH})
          export LD_LIBRARY_PATH="$b/lib"
          rc=0
          for p in udp srt rtsp rtp rtpmanager; do
            so="$b/lib/gstreamer-1.0/libgst$p.so"
            if [ ! -f "$so" ]; then
              echo "::error::live-path plugin libgst$p.so is missing from the bundle"; rc=1; continue
            fi
            if ldd "$so" | grep -q 'not found'; then
              echo "::error::libgst$p.so has an unresolved dependency in the bundle:"
              ldd "$so" | grep 'not found'; rc=1
            fi
          done
          [ "$rc" -eq 0 ] && echo "all five live-path plugins present with their closures resolved"
          exit "$rc"

      # And prove one live path runs end to end through the tool, not just that
      # its plugin loads: replay the fixture to a UDP sink. Unicast loopback, not
      # multicast — udpsink loads from the bundle identically either way (the "no
      # GStreamer in the container" check above guarantees the plugin can only
      # come from the bundle), but multicast needs an outgoing 239.0.0.0/8 route
      # this job's container may not have, which would fail the release for an
      # environmental reason unrelated to any missing plugin. No listener is
      # needed; the replay does one play-through then exits.
      - name: Check a live output path runs from the bundle
        run: |
          cd parrot-to-klv-*-linux-${ARCH}/
          ./parrot-to-klv -i ../fixtures/parrot_v3_video_audio.mp4 -o udp://127.0.0.1:30011 \
            || { echo "::error::file->UDP replay failed from the bundle — a live-path plugin is missing"; exit 1; }
          echo "file->UDP replay succeeded from the bundle"

  smoke-image:
    # Runs on the host rather than in a container: it needs a working docker to
    # load the image into. The claim under test is different from the bundle
    # job's — not "runs without GStreamer" but "runs as the caller and leaves the
    # output owned by them", which is the failure mode a containerized file tool
    # gets wrong.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bundle-${{ matrix.arch }}
          path: dl
      - uses: actions/download-artifact@v8
        with:
          name: smoke-fixtures-${{ matrix.arch }}
          path: fixtures

      - name: Load and convert through the launcher
        run: |
          tar -xzf dl/*-docker.tar.gz
          cd parrot-to-klv-*-docker/
          mkdir -p /tmp/in /tmp/out
          cp "$GITHUB_WORKSPACE/fixtures/parrot_v3_video_audio.mp4" /tmp/in/
          ./parrot-to-klv /tmp/in/parrot_v3_video_audio.mp4 -o /tmp/out/out.ts
          test -s /tmp/out/out.ts || { echo "::error::no output written"; exit 1; }

      - name: Check the output is a conversion, and is ours
        run: |
          grep -qa KLVA /tmp/out/out.ts \
            || { echo "::error::no KLVA registration descriptor"; exit 1; }
          grep -qa MISPmicrosectime /tmp/out/out.ts \
            || { echo "::error::no ST 0604 SEI in the video"; exit 1; }
          # The regression test for --user. Without it the container runs as root
          # and the user cannot delete their own output.
          owner=$(stat -c '%u:%g' /tmp/out/out.ts)
          [ "$owner" = "$(id -u):$(id -g)" ] \
            || { echo "::error::output owned by $owner, expected $(id -u):$(id -g)"; exit 1; }
          echo "output carries KLV and ST 0604, owned by the invoking user"

      - name: Non-interactive with no arguments must fail, not hang
        run: |
          cd parrot-to-klv-*-docker/
          set +e
          timeout 20 ./parrot-to-klv < /dev/null > /dev/null 2>&1
          code=$?
          set -e
          [ "$code" -eq 124 ] && { echo "::error::launcher hung waiting for a prompt"; exit 1; }
          [ "$code" -ne 0 ] || { echo "::error::launcher succeeded with no input"; exit 1; }
          echo "exits $code without prompting"

  publish:
    # Only a tag publishes. A workflow_dispatch run stops after smoke, which is
    # what makes it safe to use for testing the pipeline itself.
    needs: [smoke, smoke-image]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7   # for CHANGELOG.md
      - uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          path: dl
          merge-multiple: true

      # The release page gets the hand-written section from CHANGELOG.md, not
      # just the commit list. --generate-notes alone would publish raw commit
      # subjects, which for a release containing a change *and its revert* reads
      # as two contradictory claims — one of them a headline that is no longer
      # true. A user should be told what changed for them, not shown our churn.
      #
      # Falls back to generated notes if the tag has no section, rather than
      # failing the publish: a release with weaker notes beats no release.
      - name: Extract the changelog section for this tag
        run: |
          awk -v tag="## $GITHUB_REF_NAME" '
                $0 == tag {found=1; next}
                found && /^## v/ {exit}
                found
              ' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md \
            || echo "::warning::no CHANGELOG.md section for $GITHUB_REF_NAME, falling back to generated notes"

      # notes.md is the one source of truth for which path we take — it is right
      # there in the workspace, so there is nothing to carry between the steps.
      # The test is "has a non-blank line", not -s: a heading added ahead of its
      # body extracts as a lone newline, which -s calls content and would
      # publish as an empty release page.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if grep -q '[^[:space:]]' notes.md; then
            notes_args=(--notes-file notes.md)
          else
            notes_args=(--generate-notes)
          fi
          # The fallback is for a release that already exists — a re-run, or a
          # tag released by hand. Uploading the assets is not enough there: the
          # notes are the point of this job, so set them on that path too, or a
          # re-run "succeeds" having silently left the old body in place.
          gh release create "$GITHUB_REF_NAME" dl/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            "${notes_args[@]}" \
          || {
            gh release upload "$GITHUB_REF_NAME" dl/* --repo "$GITHUB_REPOSITORY" --clobber
            if grep -q '[^[:space:]]' notes.md; then
              gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
            fi
          }
