# Internal Markdown link check. Runs on every push / pull request and fails on
# any of:
#   - an internal Markdown link pointing at a file that doesn't exist,
#   - a root-absolute link (`](/concept.md)`) — banned by CONVENTIONS § Linking
#     because it resolves against the site root, not the bundle root, so it
#     works nowhere: not on GitHub, not in an editor, not for an agent, or
#   - a `[[slug]]` wikilink naming no concept in the bundle — this repo's own
#     convention for context/ -> context/ references, or
#   - a `[^label]` citation footnote whose label matches no `sources[].id` in
#     the same file's frontmatter. That label is the join key OKF resolves
#     attribution through, so a dangling one is a citation pointing nowhere —
#     and the spec leaves the case undefined, so consumers can't be relied on
#     to flag it.
# Ignores links inside fenced blocks, inline code, and HTML comments, so
# documented link *syntax* examples don't trip it.
#
# Enabled here. It arrived from okf-project-template carrying a header that said
# it was disabled by a ".disabled" suffix — true of the template, not of this
# copy, which was renamed on the way in.
name: link-check
on: [push, pull_request]
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check internal Markdown links
        run: |
          python3 - <<'PY'
          import re, os, glob, sys
          bad = 0
          concepts = {os.path.splitext(os.path.basename(p))[0]
                      for p in glob.glob('context/**/*.md', recursive=True)}
          for f in sorted(glob.glob('**/*.md', recursive=True)):
              # Local build trees (gitignored). CI checks out fresh so they are
              # absent there, but a developer's `build/_deps/` holds the whole
              # fetched libmisbklv checkout — over a hundred of its docs. Those
              # are the sister repo's to keep green, and an upstream edit must
              # not fail a run here, so a local run has to see what CI sees.
              # Match only root directories: a tracked root document such as
              # build-guide.md must still be checked.
              top = f.split(os.sep, 1)
              if len(top) == 2 and (top[0] == 'build' or top[0].startswith('build-')):
                  continue
              raw = open(f, encoding='utf-8').read()
              # sources[].id values declared in this file's frontmatter
              fm = re.match(r'---\n(.*?)\n---\n', raw, flags=re.DOTALL)
              ids = set(re.findall(r'^\s*-?\s*id:\s*(\S+)', fm.group(1), flags=re.M)) if fm else set()
              # Order matters: code first, comments last. A doc that *documents*
              # comment syntax has a bare `<!--` inside a code block, and
              # stripping comments first pairs it with a `-->` far below,
              # swallowing the fences in between and blinding every check that
              # follows. Removing code spans first leaves only real comments.
              text = raw
              text = re.sub(r'```.*?```', '', text, flags=re.DOTALL)   # drop fenced code
              text = re.sub(r'`[^`]*`', '', text)                      # drop inline code
              text = re.sub(r'<!--.*?-->', '', text, flags=re.DOTALL)  # drop HTML comments
              base = os.path.dirname(f)
              for m in re.findall(r'\]\(([^)]+)\)', text):
                  t = m.split('#')[0].strip()
                  if not t or t.startswith(('http://', 'https://', 'mailto:')):
                      continue
                  # Root-absolute links resolve against the site root, not the
                  # bundle root, so they work nowhere. CONVENTIONS bans them —
                  # flag them, never silently remap them onto context/.
                  if t.startswith('/'):
                      print(f'ROOT-ABSOLUTE  {f}  ->  {m}   (use a ./relative path)')
                      bad += 1
                      continue
                  if not os.path.exists(os.path.normpath(os.path.join(base, t))):
                      print(f'BROKEN  {f}  ->  {m}'); bad += 1
              # [[slug]] wikilinks resolve by concept name, not path — the
              # bundle's usual form for context/ -> context/ references.
              for w in re.findall(r'\[\[([^\]]+)\]\]', text):
                  slug = w.split('|')[0].split('#')[0].strip()
                  if slug not in concepts:
                      print(f'BROKEN WIKILINK  {f}  ->  [[{w}]]'); bad += 1
              # [^label] citation footnotes join to sources[].id in this file.
              for lab in set(re.findall(r'\[\^([^\]]+)\]', text)):
                  if lab not in ids:
                      print(f'DANGLING FOOTNOTE  {f}  ->  [^{lab}]   (no sources[].id)'); bad += 1
          print('all internal links resolve' if not bad else f'{bad} bad link(s)')
          sys.exit(1 if bad else 0)
          PY
