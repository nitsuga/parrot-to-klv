# Internal Markdown link check. Runs on every push / pull request and fails if an
# internal Markdown link points at a file that doesn't exist. (Ignores links
# inside inline-code and HTML comments, so documented link *syntax* examples
# don't trip it.)
#
# Enabled here. It arrived from okf-project-template carrying a header that said
# it was disabled by a ".disabled" suffix — true of the template, not of this
# copy, which was renamed on the way in.
name: link-check
on: [push, pull_request]
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check internal Markdown links
        run: |
          python3 - <<'PY'
          import re, os, glob, sys
          bad = 0
          for f in sorted(glob.glob('**/*.md', recursive=True)):
              text = open(f, encoding='utf-8').read()
              text = re.sub(r'<!--.*?-->', '', text, flags=re.DOTALL)  # drop HTML comments
              text = re.sub(r'`[^`]*`', '', text)                      # drop inline code
              base = os.path.dirname(f)
              for m in re.findall(r'\]\(([^)]+)\)', text):
                  t = m.split('#')[0].strip()
                  if not t or t.startswith(('http://', 'https://', 'mailto:')):
                      continue
                  # Root-absolute links resolve against the site root, not the
                  # bundle root, so they work nowhere. CONVENTIONS bans them —
                  # flag them, never silently remap them onto context/.
                  if t.startswith('/'):
                      print(f'ROOT-ABSOLUTE  {f}  ->  {m}   (use a ./relative path)')
                      bad += 1
                      continue
                  if not os.path.exists(os.path.normpath(os.path.join(base, t))):
                      print(f'BROKEN  {f}  ->  {m}'); bad += 1
          print('all internal links resolve' if not bad else f'{bad} bad link(s)')
          sys.exit(1 if bad else 0)
          PY
