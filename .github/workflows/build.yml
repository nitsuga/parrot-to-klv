name: Build and test

# The suite runs against committed fixtures only, so CI needs no drone footage
# and no encoder: test/make_fixture.py regenerates the fixtures and needs ffmpeg,
# but nothing here runs it.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes this run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # -dev packages for the build (libmisbklv's gstreamer backend links
      # gstreamer-1.0, gstreamer-app-1.0 and gstreamer-codecparsers-1.0); the
      # plugin packages for the run. The conversion loads coreelements (core),
      # typefindfunctions and app (base), isomp4/qtdemux (good), and mpegtsmux +
      # videoparsersbad (bad). libmisbklv now selects explicit demuxers, so it
      # no longer needs playback/parsebin or audioparsers at runtime.
      #
      # libgstreamer-plugins-bad1.0-dev is easy to miss: codecparsers is a *-dev*
      # package, and installing only the runtime gstreamer1.0-plugins-bad leaves
      # libmisbklv quietly building without its media backend. That is not a
      # theoretical trap — it is what it did here, and every build failed at
      # configure until this line was added.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad

      # libmisbklv is a private repo, so the runner needs its own credential:
      # GITHUB_TOKEN is scoped to *this* repository and cannot clone it. A
      # read-only deploy key on libmisbklv, held here as a secret, is the
      # narrowest thing that works — see .github/workflows/README-ci.md.
      - name: Authorize the private dependency
        env:
          MISBKLV_DEPLOY_KEY: ${{ secrets.MISBKLV_DEPLOY_KEY }}
        run: |
          if [ -z "$MISBKLV_DEPLOY_KEY" ]; then
            echo "::error::secret MISBKLV_DEPLOY_KEY is not set — see .github/workflows/README-ci.md"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$MISBKLV_DEPLOY_KEY" > ~/.ssh/misbklv
          chmod 600 ~/.ssh/misbklv
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host github.com\n  IdentityFile ~/.ssh/misbklv\n  IdentitiesOnly yes\n' \
            >> ~/.ssh/config

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # -L parrot: libmisbklv is a subproject, so an unfiltered ctest would also
      # run its suite — including the tests needing the media skipped above.
      # Upstream has its own CI; this job tests this project.
      - name: Test
        run: ctest --test-dir build -L parrot --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The sanitizer subset does not run the mux path, so it needs the build
      # headers for libmisbklv's optional GStreamer backend but no runtime
      # plugins.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev

      # GITHUB_TOKEN is scoped to this repository, so use the same narrow,
      # read-only deploy key as the normal build to fetch private libmisbklv.
      - name: Authorize the private dependency
        env:
          MISBKLV_DEPLOY_KEY: ${{ secrets.MISBKLV_DEPLOY_KEY }}
        run: |
          if [ -z "$MISBKLV_DEPLOY_KEY" ]; then
            echo "::error::secret MISBKLV_DEPLOY_KEY is not set — see .github/workflows/README-ci.md"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$MISBKLV_DEPLOY_KEY" > ~/.ssh/misbklv
          chmod 600 ~/.ssh/misbklv
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host github.com\n  IdentityFile ~/.ssh/misbklv\n  IdentitiesOnly yes\n' \
            >> ~/.ssh/config

      - name: Configure sanitizer build
        run: >-
          cmake -S . -B build-sanitizers -DCMAKE_BUILD_TYPE=Debug
          -DPARROT_SANITIZE=ON

      - name: Build sanitizer test targets
        run: >-
          cmake --build build-sanitizers -j"$(nproc)" --target
          mp4_extraction_test parrot_v3_test parrot_proto_test
          session_metadata_test transform_test parrot_scrub_test conformance_test

      - name: Test sanitizer subset
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          ctest --test-dir build-sanitizers -L parrot-sanitize
          --output-on-failure --timeout 120
