name: Build and test

# The suite runs against committed fixtures only, so CI needs no drone footage
# and no encoder: test/make_fixture.py regenerates the fixtures and needs ffmpeg,
# but nothing here runs it.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes this run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true  # test fixtures are LFS objects; a bare checkout gets pointers

      - uses: ./.github/actions/install-build-deps

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release -j"$(nproc)"

      # -L parrot: libmisbklv is a subproject, so an unfiltered ctest would also
      # run its suite — including the tests needing the media skipped above.
      # Upstream has its own CI; this job tests this project.
      - name: Test
        run: ctest --test-dir build/release -L parrot --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true  # test fixtures are LFS objects; a bare checkout gets pointers

      - uses: ./.github/actions/install-build-deps
        with:
          extra-packages: pkg-config

      - name: Configure sanitizer build
        run: cmake --preset sanitize

      - name: Build sanitizer test targets
        run: cmake --build --preset sanitize -j"$(nproc)"

      - name: Test sanitizer suite
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          ctest --test-dir build/sanitize -L parrot-sanitize
          --output-on-failure --timeout 120
